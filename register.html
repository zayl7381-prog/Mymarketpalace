<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mymarketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-indigo-600">🛡️ Admin Dashboard - အကောင့်လျှောက်လွှာများ</h2>
            <button onclick="fetchUsers()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700">🔄 Data Refresh</button>
        </div>
        
        <div id="statusMessage" class="text-center py-8 text-gray-600 font-medium text-lg">အချက်အလက်များကို ရယူနေပါသည်...</div>
        
        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-gray-200 hidden" id="userTable">
                <thead>
                    <tr class="bg-indigo-50 text-indigo-700 text-sm">
                        <th class="border border-gray-200 p-3">အမည်</th>
                        <th class="border border-gray-200 p-3">ငွေပေးချေမှု</th>
                        <th class="border border-gray-200 p-3">ဖုန်းနံပါတ်</th>
                        <th class="border border-gray-200 p-3">မှတ်ပုံတင် (ရှေ့/နောက်)</th>
                        <th class="border border-gray-200 p-3">QR Code</th>
                        <th class="border border-gray-200 p-3">အခြေအနေ</th>
                        <th class="border border-gray-200 p-3">လုပ်ဆောင်ချက်</th>
                    </tr>
                </thead>
                <tbody id="userTableBody" class="text-sm text-gray-700">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jmnkghz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptbmtnaHpzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg0NDI5NjYxLCJleHAiOjIxMDAwMDU2NjF9.sQSU7CGTBXDWFQ_QtPiixJC';

        async function fetchUsers() {
            const statusMessage = document.getElementById('statusMessage');
            const userTable = document.getElementById('userTable');
            const userTableBody = document.getElementById('userTableBody');

            statusMessage.style.display = 'block';
            statusMessage.innerText = 'အချက်အလက်များကို ရယူနေပါသည်...';
            userTable.classList.add('hidden');

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`Server Error: ${response.status} ${response.statusText}`);
                }

                const users = await response.json();

                if (!users || users.length === 0) {
                    statusMessage.innerText = 'လျှောက်လွှာ မရှိသေးပါ။';
                    return;
                }

                statusMessage.style.display = 'none';
                userTable.classList.remove('hidden');
                userTableBody.innerHTML = '';

                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50 text-center';
                    
                    row.innerHTML = `
                        <td class="border border-gray-200 p-3 font-medium">${user.name || '-'}</td>
                        <td class="border border-gray-200 p-3"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">${user.payment_method || '-'}</span></td>
                        <td class="border border-gray-200 p-3">${user.phone || '-'}</td>
                        <td class="border border-gray-200 p-3 space-x-2">
                            ${user.idCardFront ? `<a href="${user.idCardFront}" target="_blank" class="text-indigo-600 underline font-semibold">ရှေ့ပုံ</a>` : '-'} /
                            ${user.idCardBack ? `<a href="${user.idCardBack}" target="_blank" class="text-indigo-600 underline font-semibold">နောက်ပုံ</a>` : '-'}
                        </td>
                        <td class="border border-gray-200 p-3">
                            ${user.payQr ? `<a href="${user.payQr}" target="_blank" class="text-indigo-600 underline font-semibold">QR ကြည့်ရန်</a>` : '-'}
                        </td>
                        <td class="border border-gray-200 p-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${user.status === 'approved' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                ${user.status || 'pending'}
                            </span>
                        </td>
                        <td class="border border-gray-200 p-3">
                            ${user.status !== 'approved' ? `<button onclick="approveUser('${user.id}')" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-green-700 shadow">Approve</button>` : '<span class="text-green-600 text-xs font-bold">အတည်ပြုပြီး</span>'}
                        </td>
                    `;
                    userTableBody.appendChild(row);
                });

            } catch (error) {
                console.error('Error fetching users:', error);
                statusMessage.innerHTML = `<span class="text-red-500 font-bold">ချို့ယွင်းချက် ဖြစ်ပေါ်နေပါသည်:</span><br><span class="text-red-600 text-xs">${error.message}</span>`;
            }
        }

        async function approveUser(id) {
            if (!confirm('ဤအကောင့်ကို အတည်ပြုရန် သေချာပါသလား?')) return;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ status: 'approved' })
                });

                if (!response.ok) {
                    throw new Error('Approval failed');
                }

                alert('အကောင့်ကို အောင်မြင်စွာ အတည်ပြုပြီးပါပြီ!');
                fetchUsers(); 
            } catch (error) {
                console.error('Error approving user:', error);
                alert('အတည်ပြုရာတွင် အမှားအယွင်း ဖြစ်ပေါ်သွားပါသည်: ' + error.message);
            }
        }

        // Initial Load
        fetchUsers();
    </script>
</body>
</html>
